    "n_limitador": {

      "description": "Kuadrant's rate-limiting enforcement. The MCP Gateway deliberately does not implement auth or rate limiting itself - it stays focused on the protocol and lets integrations like Kuadrant provide these.",
      "details": [
        ["Enforces", "RateLimitPolicy"],
        ["Design constraint", "auth and limits belong to integrations"]
      ]
    },
    "n_authorino": {
      "title": "Authorino",
      "description": "Makes the per-request decision: validate the token with the authorization server, fetch whatever extra data the policy needs, then allow or deny. It is the component that turns a declarative AuthPolicy into an answer for Envoy.",
      "details": [
        ["Validates", "the JWT against the auth server"],
        ["Fetches", "ACLs, API keys, exchanged tokens"],
        ["Decides", "allow / deny, per request"]
      ]
    },
    "n_wristband": {
      "title": "Festival Wristband",
      "description": "How a permission decision travels from Authorino to the broker without being forgeable. Authorino mints a short-lived signed JWT whose allowed-capabilities claim lists the permitted items per server, and sets it as x-mcp-authorized. The broker verifies it with TRUSTED_HEADER_PUBLIC_KEY.",
      "details": [
        ["Header", "x-mcp-authorized"],
        ["Claim", "allowed-capabilities, keyed by capability type"],
        ["Verified with", "TRUSTED_HEADER_PUBLIC_KEY"],
        ["If verification fails", "the broker returns an EMPTY tool list"]
      ]
    },
    "n_kuadrantop": {
      "title": "Kuadrant Operator",
      "description": "Reconciles the policy CRs into the AuthConfig and Limits that Authorino and Limitador actually consume. Creating the Kuadrant CR is what brings those enforcement components up.",
      "details": [
        ["Reconciles", "AuthPolicy -> AuthConfig"],
        ["Reconciles", "RateLimitPolicy -> Limits"],
        ["Deploys", "Authorino and Limitador"]
      ]
    },
    "n_idp": {
      "title": "Keycloak (identity provider)",
      "description": "The reference OAuth 2.1 authorization server. Nothing in the design is Keycloak-specific - any IdP that supports OAuth, dynamic client registration and token exchange works. Phase 1 assumes a single IdP shared by every MCP server behind the gateway.",
      "details": [
        ["Reference impl", "Keycloak / RHBK"],
        ["Must support", "dynamic client registration"],
        ["For exchange", "Standard Token Exchange grant"],
        ["Phase 1 assumption", "one IdP for all MCP servers"]
      ]
    },
    "n_dcr": {
      "title": "Dynamic Client Registration",
      "description": "The MCP authorization spec expects a client to be able to register itself, so an agent nobody pre-provisioned can still obtain a token. The gateway relies on the IdP supporting it.",
      "details": [
        ["Spec", "OAuth 2.0 Dynamic Client Registration"],
        ["Keycloak", "OIDC client registration endpoint"],
        ["Needs", "full scopes allowed + the roles client scope"]
      ]
    },
    "n_resrv": {
      "title": "Resource-server clients and tool roles",
      "description": "One OAuth client per MCP server, named after the server's internal host, with one role per tool prefixed tool:. Groups aggregate those roles and users join groups. The result is a resource_access claim that lists exactly which tools each user may call, per server.",
      "details": [
        ["One client", "per MCP server"],
        ["One role", "per tool - tool:greet"],
        ["Groups", "aggregate roles; users join groups"],
        ["Produces", "the resource_access claim"],
        ["Simpler option", "map users straight to roles, skip groups"]
      ]
    },
    "n_vault": {
      "title": "Vault / key storage",
      "description": "Some MCP servers only speak API keys. Rather than teaching clients about them, the AuthPolicy fetches the key from a secret store during its metadata phase and sets it on the request heading to that one server.",
      "details": [
        ["Fetched during", "the policy's metadata phase"],
        ["Injected as", "a request header"],
        ["Scope", "that one MCP server's route"]
      ]
    },
    "n_exchange": {
      "title": "OAuth2 token exchange (RFC 8693)",
      "description": "Narrows an over-privileged gateway token down to the one backend it is actually about. A confidential client - mcp-gateway in the reference setup - performs the exchange, and the new token's audience is the target server's internal host. The original token must already include both the target audience and the exchanging client's id, or the exchange is refused.",
      "details": [
        ["Performed by", "the mcp-gateway confidential client"],
        ["New aud", "the target server's internal host"],
        ["New scope", "openid by default, overridable per route"],
        ["Original token must contain", "target aud + mcp-gateway"],
        ["Keycloak needs", "Standard Token Exchange + impersonator role"]
      ]
    },
    "n_credref": {
      "title": "credentialRef - do not confuse these",
      "description": "Two completely separate auth paths. credentialRef is the broker's own credential for listing tools and managing sessions upstream; it is never injected into a client's tools/call, never reaches the router, and never appears in a response or a log. Client-to-upstream auth is the AuthPolicy path instead.",
      "details": [
        ["Used by", "the broker only"],
        ["Used for", "tool listing and session management"],
        ["Never", "injected into a client's tools/call"],
        ["Never", "visible to the router, clients, or logs"],
        ["Client auth", "AuthPolicy, elicitation, or client headers"]
      ]
    }
  },
  "flows": {
    "discovery": {
      "label": "Registration & Tool Discovery",
      "steps": [
        { "text": "1. A platform engineer creates an HTTPRoute for the MCP server on the internal listener", "mode": "arrow", "from": "admin", "to": "n_httproute", "color": "#58a6ff", "num": 1, "glow": "c_control" },
        { "text": "2. Its hostname is never DNS-resolvable - it only gives the router an :authority to aim at", "mode": "lightup", "target": "n_httproute", "badge": 1 },
        { "text": "3. Then an MCPServerRegistration whose targetRef points at that route", "mode": "arrow", "from": "admin", "to": "n_reg", "color": "#58a6ff", "num": 3 },
        { "text": "4. toolPrefix and the optional upstream credentialRef live on the registration", "mode": "lightup", "target": "n_reg", "badge": 4 },
        { "text": "5. The discovery controller reconciles it", "mode": "arrow", "from": "n_reg", "to": "n_ctrl", "color": "#58a6ff", "num": 5 },
        { "text": "6. It walks route to accepted Gateway to extension, filtering on the listener port", "mode": "lightup", "target": "n_ctrl", "badge": 6 },
        { "text": "7. Only matching extension namespaces get the config - that is how teams stay isolated", "mode": "arrow", "from": "n_ctrl", "to": "n_cfg", "color": "#58a6ff", "num": 7 },
        { "text": "8. The broker reads that config Secret - at startup only", "mode": "arrow", "from": "n_cfg", "to": "n_broker", "color": "#3fb950", "num": 8, "glow": "c_mcp" },
        { "text": "9. The broker becomes an MCP client itself: initialize, then tools/list upstream", "mode": "arrow", "from": "n_broker", "to": "n_srv1", "color": "#3fb950", "num": 9, "glow": "c_back" },
        { "text": "10. Servers that fail the protocol-version or capability check are left out of the list", "mode": "lightup", "target": "n_srv2", "badge": 10 },
        { "text": "11. Upstream discovery auth uses credentialRef - the broker's credential, never the client's", "mode": "lightup", "target": "n_srvext", "badge": 11 },
        { "text": "12. Everything validated is merged into one prefixed, cached tool list", "mode": "lightup", "target": "n_toolcache", "badge": 12 },
        { "text": "13. The gateway adds its own meta-tools, which are never forwarded to any server", "mode": "lightup", "target": "n_meta", "badge": 13 },
        { "text": "14. A client calls tools/list and gets a single aggregated set", "mode": "arrow", "from": "n_broker", "to": "client", "color": "#3fb950", "num": 14 },
        { "text": "15. Add another server later and nothing changes for the client - same endpoint, more tools", "mode": "lightup", "target": "n_srv3", "badge": "i" }
      ]
    },
    "toolcall": {
      "label": "tools/call: Prefix Routing",
      "steps": [
        { "text": "1. tools/call test1_greet arrives on the public mcp listener", "mode": "arrow", "from": "client", "to": "n_lis_mcp", "color": "#f0883e", "num": 1, "glow": "c_gw" },
        { "text": "2. ext_proc runs first, in BUFFERED mode - STREAMED would silently drop the header mutations", "mode": "lightup", "target": "n_extproc", "badge": 1 },
        { "text": "3. Envoy hands the whole JSON-RPC body to the router", "mode": "arrow", "from": "n_extproc", "to": "n_router", "color": "#3fb950", "num": 3, "glow": "c_mcp" },
        { "text": "4. The router validates the body and resolves the test1_ prefix to its server", "mode": "lightup", "target": "n_router", "badge": 4 },
        { "text": "5. It looks for a backend session, keyed by gateway-session-id plus server name", "mode": "lightup", "target": "n_session", "badge": 5 },
        { "text": "6. Cache miss, so it hairpins an initialize back through the gateway - policies apply to that too", "mode": "arrow", "from": "n_router", "to": "n_lis_mcps", "color": "#3fb950", "num": 6 },
        { "text": "7. The backend session id is cached, and rewritten so clients only ever see gateway ids", "mode": "lightup", "target": "n_session", "badge": 7 },
        { "text": "8. :authority is rewritten to the backend's route host - the router owns this header", "mode": "lightup", "target": "n_authority", "badge": 8 },
        { "text": "9. The prefix is stripped from the body: test1_greet becomes greet", "mode": "lightup", "target": "n_router", "badge": 9 },
        { "text": "10. x-mcp-servername and x-mcp-toolname are set from the body, never by the client", "mode": "arrow", "from": "n_router", "to": "n_wasm", "color": "#ffa657", "num": 10, "glow": "c_policy" },
        { "text": "11. Only now does the WASM filter call Authorino - the tool headers already exist", "mode": "lightup", "target": "n_authorino", "badge": 11 },
        { "text": "12. Allowed, so the Envoy router resolves the rewritten authority to a cluster", "mode": "arrow", "from": "n_wasm", "to": "n_envoyrt", "color": "#3fb950", "num": 12 },
        { "text": "13. The request reaches the backend over the internal listener", "mode": "arrow", "from": "n_envoyrt", "to": "n_srv1", "color": "#3fb950", "num": 13, "glow": "c_back" },
        { "text": "14. Internal headers are stripped first - the server sees a plain unprefixed tool call", "mode": "lightup", "target": "n_srv1", "badge": 14 },
        { "text": "15. The result streams back as SSE, with gateway session ids restored on the way out", "mode": "arrow", "from": "n_srv1", "to": "client", "color": "#3fb950", "num": 15 },
        { "text": "16. If the router is down, failure_mode_allow: false means requests are rejected, not waved through", "mode": "lightup", "target": "n_extproc", "badge": "i" }
      ]
    },
    "oauth": {
      "label": "OAuth Discovery (Auth Phase 1)",
      "steps": [
        { "text": "1. A fresh client sends initialize with no token at all", "mode": "arrow", "from": "client", "to": "n_lis_mcp", "color": "#ffa657", "num": 1, "glow": "c_gw" },
        { "text": "2. The AuthPolicy on /mcp tells the WASM filter to call Authorino", "mode": "lightup", "target": "n_authpol_gw", "badge": 1 },
        { "text": "3. Authorino has nothing to validate", "mode": "arrow", "from": "n_wasm", "to": "n_authorino", "color": "#ffa657", "num": 3, "glow": "c_policy" },
        { "text": "4. 401 with WWW-Authenticate, carrying a resource_metadata URL", "mode": "arrow", "from": "n_authorino", "to": "client", "color": "#f85149", "num": 4 },
        { "text": "5. The client follows it to /.well-known/oauth-protected-resource/mcp - deliberately unprotected", "mode": "arrow", "from": "client", "to": "n_wellknown", "color": "#ffa657", "num": 5, "glow": "c_gw" },
        { "text": "6. The broker serves the metadata and does nothing else with it", "mode": "arrow", "from": "n_wellknown", "to": "n_rmeta", "color": "#3fb950", "num": 6, "glow": "c_mcp" },
        { "text": "7. resource, authorization_servers, bearer_methods_supported, scopes_supported", "mode": "lightup", "target": "n_rmeta", "badge": 7 },
        { "text": "8. Nobody pre-provisioned this agent, so it registers itself", "mode": "arrow", "from": "client", "to": "n_dcr", "color": "#db61a2", "num": 8, "glow": "c_idp" },
        { "text": "9. Keycloak authenticates the user and issues an access token", "mode": "lightup", "target": "n_idp", "badge": 9 },
        { "text": "10. The scope set is aggregated across every server, so this token is over-privileged by design", "mode": "lightup", "target": "n_rmeta", "badge": "i" },
        { "text": "11. Token in hand", "mode": "arrow", "from": "n_idp", "to": "client", "color": "#db61a2", "num": 11 },
        { "text": "12. initialize again, this time with Authorization: Bearer", "mode": "arrow", "from": "client", "to": "n_lis_mcp", "color": "#3fb950", "num": 12 },
        { "text": "13. Authorino validates the JWT against the configured authorization server", "mode": "arrow", "from": "n_wasm", "to": "n_authorino", "color": "#ffa657", "num": 13, "glow": "c_policy" },
        { "text": "14. 200 - and since initialize is not a tool call, it goes to the broker", "mode": "arrow", "from": "n_authorino", "to": "n_broker", "color": "#3fb950", "num": 14, "glow": "c_mcp" },
        { "text": "15. The broker answers with its capabilities and an mcp-session-id", "mode": "arrow", "from": "n_broker", "to": "client", "color": "#3fb950", "num": 15 }
      ]
    },
    "filtering": {
      "label": "Identity-Based Tool Filtering (Phase 2)",
      "steps": [
        { "text": "1. tools/list with a valid bearer token", "mode": "arrow", "from": "client", "to": "n_lis_mcp", "color": "#ffa657", "num": 1, "glow": "c_gw" },
        { "text": "2. Authorino authenticates, then runs its metadata phase", "mode": "lightup", "target": "n_authorino", "badge": 1 },
        { "text": "3. The token's resource_access claim lists tool: roles per MCP server client", "mode": "lightup", "target": "n_resrv", "badge": 2 },
        { "text": "4. A header the client could forge would be worthless, so Authorino signs one instead", "mode": "arrow", "from": "n_authorino", "to": "n_wristband", "color": "#ffa657", "num": 4, "glow": "c_policy" },
        { "text": "5. The wristband is a short-lived JWT with an allowed-capabilities claim, set as x-mcp-authorized", "mode": "lightup", "target": "n_wristband", "badge": 5 },
        { "text": "6. It travels with the request to the broker", "mode": "arrow", "from": "n_wristband", "to": "n_broker", "color": "#3fb950", "num": 6, "glow": "c_mcp" },
        { "text": "7. The broker verifies it with TRUSTED_HEADER_PUBLIC_KEY and reads the capabilities map", "mode": "lightup", "target": "n_broker", "badge": 7 },
        { "text": "8. The cached aggregate is filtered to what this identity may actually see", "mode": "lightup", "target": "n_toolcache", "badge": 8 },
        { "text": "9. tools/list returns only the permitted tools", "mode": "arrow", "from": "n_broker", "to": "client", "color": "#3fb950", "num": 9 },
        { "text": "10. If verification fails the broker returns an EMPTY list - it never falls back to everything", "mode": "lightup", "target": "n_broker", "badge": "✗", "errColor": "#f85149" },
        { "text": "11. Filtering covers the catalog too, so agents only discover tools they are allowed to call", "mode": "lightup", "target": "n_meta", "badge": "i" },
        { "text": "12. A client-supplied X-Mcp-Virtualserver narrows the offer further - it never widens it", "mode": "lightup", "target": "n_vsrv", "badge": "i" }
      ]
    },
    "exchange": {
      "label": "Token Exchange & API Keys",
      "steps": [
        { "text": "1. tools/call arrives with the broad gateway-audience token from phase 1", "mode": "arrow", "from": "client", "to": "n_lis_mcp", "color": "#39c5cf", "num": 1, "glow": "c_gw" },
        { "text": "2. The router sets x-mcp-servername, so policy knows which backend this is about", "mode": "lightup", "target": "n_router", "badge": 1 },
        { "text": "3. The AuthPolicy protecting tool calls takes over", "mode": "arrow", "from": "n_wasm", "to": "n_authpol_be", "color": "#ffa657", "num": 3, "glow": "c_policy" },
        { "text": "4. Authentication first: Authorino validates the incoming JWT", "mode": "lightup", "target": "n_authorino", "badge": 4 },
        { "text": "5. Then metadata: it calls Keycloak as the mcp-gateway confidential client to exchange it", "mode": "arrow", "from": "n_authorino", "to": "n_exchange", "color": "#39c5cf", "num": 5, "glow": "c_vault" },
        { "text": "6. The new token's aud is the target server's internal host, with a narrow scope", "mode": "lightup", "target": "n_exchange", "badge": 6 },
        { "text": "7. The original token must already carry that aud AND mcp-gateway, or the exchange is refused", "mode": "lightup", "target": "n_idp", "badge": "i" },
        { "text": "8. Authorization passes, so Authorization: Bearer is replaced with the scoped token", "mode": "arrow", "from": "n_exchange", "to": "n_srv1", "color": "#3fb950", "num": 8, "glow": "c_back" },
        { "text": "9. A legacy backend wants an API key instead - same metadata phase, different source", "mode": "arrow", "from": "n_authorino", "to": "n_vault", "color": "#39c5cf", "num": 9, "glow": "c_vault" },
        { "text": "10. The key is fetched from Vault and injected as a header for that one server", "mode": "lightup", "target": "n_vault", "badge": 10 },
        { "text": "11. The external server sees only its own API key, and the client never held it", "mode": "arrow", "from": "n_vault", "to": "n_srvext", "color": "#3fb950", "num": 11 },
        { "text": "12. None of this is credentialRef - that one is broker-to-upstream discovery, never a client call", "mode": "lightup", "target": "n_credref", "badge": "i" }
      ]
    },
    "progressive": {
      "label": "Progressive Tool Discovery",
      "steps": [
        { "text": "1. An agent connects to a gateway federating 20+ MCP servers", "mode": "arrow", "from": "client", "to": "n_broker", "color": "#3fb950", "num": 1, "glow": "c_mcp" },
        { "text": "2. A naive tools/list would return 100-300 full JSON schemas on turn one", "mode": "lightup", "target": "n_toolcache", "badge": 1 },
        { "text": "3. That costs context, costs tokens, and measurably degrades which tool the model picks", "mode": "lightup", "target": "n_toolcache", "badge": "✗", "errColor": "#f85149" },
        { "text": "4. So the gateway offers two meta-tools instead - it is the only component that sees everything", "mode": "lightup", "target": "n_meta", "badge": 4 },
        { "text": "5. Turn 1: the agent calls tool_catalog and gets categories, hints and names - no schemas", "mode": "arrow", "from": "client", "to": "n_meta", "color": "#3fb950", "num": 5 },
        { "text": "6. The metadata comes from the registrations, so operators add it once, per server", "mode": "lightup", "target": "n_reg", "badge": 6, "glow": "c_control" },
        { "text": "7. The model picks on intent, not keywords: \"book a restaurant\" also implies calendar tools", "mode": "lightup", "target": "n_meta", "badge": 7 },
        { "text": "8. It calls select_tools to scope the session to the handful it actually needs", "mode": "arrow", "from": "client", "to": "n_broker", "color": "#3fb950", "num": 8 },
        { "text": "9. Turn 2 onward: tools/list returns only those, now with full schemas", "mode": "arrow", "from": "n_broker", "to": "client", "color": "#3fb950", "num": 9 },
        { "text": "10. A curated MCPVirtualServer shows up in the catalog too, so agents can just use it", "mode": "lightup", "target": "n_vsrv", "badge": 10 },
        { "text": "11. The threshold flag decides when this is enforced - 0 means no tool is ever hidden", "mode": "lightup", "target": "n_meta", "badge": "i" },
        { "text": "12. Cost: one extra turn. Benefit: far fewer tokens and better tool selection", "mode": "arrow", "from": "n_broker", "to": "n_srv1", "color": "#3fb950", "num": 12, "glow": "c_back" }
      ]
    }
  },
  "flowOrder": ["discovery", "toolcall", "oauth", "filtering", "exchange", "progressive"],
  "defaultFlow": "discovery",
  "legend": [
    { "color": "#58a6ff", "label": "Control plane · discovery" },
    { "color": "#f0883e", "label": "Gateway · Envoy filter chain" },
    { "color": "#3fb950", "label": "MCP Gateway · router + broker" },
    { "color": "#d2a8ff", "label": "Upstream MCP servers" },
    { "color": "#ffa657", "label": "Kuadrant · AuthPolicy" },
    { "color": "#db61a2", "label": "Identity provider" },
    { "color": "#39c5cf", "label": "Credentials · token exchange" },
    { "color": "#f85149", "label": "Denied / degraded" }
  ]
};

await viz.load(diagram);

const cvs = el('fs-canvas');
cvs.addEventListener('mousemove', e => {
  const rect = cvs.getBoundingClientRect();
  const eng = viz._engine;
  const mx = (e.clientX - rect.left - eng._ox) / eng._sc;
  const my = (e.clientY - rect.top - eng._oy) / eng._sc;
  let hit = false;
  for (const [k, n] of Object.entries(eng.state.nodes)) {
    if (n.type === 'boundary' || n.type === 'container') continue;
    if (eng.state.tooltips[k] && mx >= n.x && mx <= n.x + n.w && my >= n.y && my <= n.y + n.h) {
      hit = true;
      break;
    }
  }
  cvs.style.cursor = hit ? 'pointer' : 'default';
});

viz.state.loopMode = true;
viz.play();
</script>
