        ["Strips", "the tool prefix before forwarding"],
        ["Client-settable", "never - the router parses them from the body"]
      ]
    },
    "n_broker": {
      "title": "MCP Broker",
      "description": "The default backend for /mcp. It answers initialize and tools/list, acts as an MCP client to every discovered server, builds the aggregated tool list, and brokers SSE notifications in both directions.",
      "details": [
        ["Port", "8080"],
        ["Handles", "initialize, tools/list, notifications"],
        ["Never handles", "tools/call - those are re-routed"],
        ["Reads config", "at startup only"]
      ]
    },
    "n_config": {
      "title": "mcp-gateway-config Secret",
      "description": "A Secret, not a ConfigMap, written by the controller from the registrations and their HTTPRoutes. The broker reads it only at startup - which is the whole reason registering a server needs a broker restart.",
      "details": [
        ["Kind", "Secret"],
        ["Written by", "the controller"],
        ["Read", "at broker startup only"],
        ["Consequence", "new server => rollout restart"]
      ]
    },
    "n_rhbk": {
      "title": "Red Hat build of Keycloak",
      "description": "The OAuth 2.1 authorization server, deployed with a realm import. The operator ships no OpenShift Route, so this guide disables its Ingress and provides its own Route named keycloak, which every later phase depends on.",
      "details": [
        ["Realm", "mcp"],
        ["Route", "shipped by the guide, named keycloak"],
        ["Re-import", "delete the realm first - import does not update"],
        ["Token scope", "openid groups roles"]
      ],
      "links": [["Phase 6 of the guide", "../06-deploy-keycloak.html"]]
    },
    "n_clients": {
      "title": "resource-server clients",
      "description": "One OAuth client per MCP server, whose clientId must match exactly what the gateway puts in the x-mcp-servername header: <namespace>/<registration-name>.",
      "details": [
        ["clientId format", "<namespace>/<registration-name>"],
        ["Example", "mcp-test/external-server"],
        ["Must match", "the x-mcp-servername header, exactly"]
      ]
    },
    "n_roles": {
      "title": "tool: client roles",
      "description": "Each tool becomes a client role named tool:<name>, using the tool name WITHOUT the registration prefix. The tool exposed as dw_read_wiki_structure needs the role tool:read_wiki_structure.",
      "details": [
        ["Format", "tool:<unprefixed-tool-name>"],
        ["Exposed as", "dw_read_wiki_structure"],
        ["Role needed", "tool:read_wiki_structure"],
        ["Also needed", "a clientScopeMapping to the mcp-gateway client"]

    "n_oauthpr": {
      "title": "oauthProtectedResource",

      "details": [
        ["Field", "MCPGatewayExtension.spec.oauthProtectedResource"],
        ["Serves", "/.well-known/oauth-protected-resource/mcp"],
        ["Do not use", "oc set env on the broker Deployment"]
      ]
    },
    "n_kuadrant": {
      "title": "Kuadrant CR",
      "description": "Creating it deploys Authorino and the WASM filter that enforces AuthPolicy per request. The OperatorGroup has to be in AllNamespaces mode - and a correctly configured one reports {\"upgradeStrategy\":\"Default\"}, not an empty object.",
      "details": [
        ["Deploys", "Authorino, Limitador, WASM filter"],
        ["OperatorGroup", "AllNamespaces (no targetNamespaces)"],
        ["After creating", "restart the Gateway deployment"]
      ]
    },
    "n_authpol": {
      "title": "mcp-auth-policy",
      "description": "Validates the JWT on the public mcp listener. Unauthenticated requests outside /.well-known get a 401 with a WWW-Authenticate header pointing at the resource metadata, which is how a client discovers where to authenticate.",
      "details": [
        ["Listener", "mcp (public)"],
        ["Does", "JWT validation against the RHBK issuer"],
        ["On failure", "401 + WWW-Authenticate: resource_metadata=..."],
        ["Keep it", "Phase 8 adds a second policy, it does not replace this one"]
      ],
      "links": [["Phase 7 of the guide", "../07-authentication.html"]]
    },
    "n_authzpol": {
      "title": "mcp-authz-policy",
      "description": "Tool-level authorization on the internal mcps listener, where the x-mcp-toolname and x-mcp-servername headers exist. Both AuthPolicies must coexist: this one does not replace the Phase 7 policy.",
      "details": [
        ["Listener", "mcps (internal)"],
        ["Evaluates", "CEL against resource_access"],
        ["Check both", "ENFORCED=True on mcp-auth-policy AND mcp-authz-policy"]
      ],
      "links": [["Phase 8 of the guide", "../08-authorization.html"]]
    },
    "n_hdr": {
      "title": "x-mcp-toolname / servername / method",
      "description": "Router-set from the JSON-RPC body, parsed before AuthPolicy is evaluated, and never settable by a client. The policy also requires x-mcp-method == tools/call, so that session setup is not denied.",
      "details": [
        ["x-mcp-toolname", "the tool being called"],
        ["x-mcp-servername", "<namespace>/<registration-name>"],
        ["x-mcp-method", "must equal tools/call"],
        ["Without the method guard", "a misleading 500 instead of a clean 403"]
      ]
    },
    "n_claim": {
      "title": "resource_access claim",
      "description": "The JWT claim that carries the user's tool roles, grouped per MCP server client. The CEL rule prepends tool: to the header value and looks for it under the entry matching x-mcp-servername.",
      "details": [
        ["Shape", "resource_access[<server>].roles"],
        ["Example", "mcp-test/test-server1 => [tool:greet, ...]"],
        ["mcp user", "all tools on both servers"],
        ["restricted user", "tool:greet only"]
      ]
    },
    "n_vs": {
      "title": "MCPVirtualServer",
      "description": "A curated subset of the federated tools, so an agent can be handed exactly the tools one job needs instead of the whole catalogue. Virtual servers can reference categories, so new tools in a category appear automatically.",
      "details": [
        ["Examples", "risk-analysis, basic-tools"],
        ["Namespace", "mcp-system - hardcoded by the controller"],
        ["Selects", "individual tools or whole categories"]
      ],
      "links": [["Phase 9 of the guide", "../09-virtual-servers.html"]]
    },
    "n_merge": {
      "title": "merge-virtualserver-config.sh",
      "description": "The virtual server config has to be merged into the broker's config Secret. Skip it and the broker logs \"failed to get virtual server ... not found\" and every request carrying the header fails, even though the MCPVirtualServer resources look perfectly healthy.",
      "details": [
        ["Run", "./scripts/merge-virtualserver-config.sh"],
        ["Then", "restart the broker"],
        ["Symptom if skipped", "\"virtual server not found\""]
      ]
    },
    "n_vshdr": {
      "title": "X-Mcp-Virtualserver header",
      "description": "The client opts into a virtual server per request with this header. Without it, tools/list returns the full aggregated set. Authorization still applies on top - a virtual server narrows what is offered, it does not grant access.",
      "details": [
        ["Format", "namespace/name"],
        ["Example", "mcp-system/risk-analysis"],
        ["Omitted", "full aggregated tool list"],
        ["Interaction", "authorization is still enforced"]
      ]
    }
  },
  "flows": {
    "full": {
      "label": "Full Install (Phases 1-9)",
      "steps": [
        { "text": "1. Phase 1 begins - install the operators (./scripts/setup-mcp-gateway.sh)", "mode": "arrow", "from": "admin", "to": "c1_prereq", "color": "#58a6ff", "num": 1, "glow": "c1_prereq" },
        { "text": "2. Install OSSM 3 so a GatewayClass exists - Track A only, skip it if you already have one", "mode": "lightup", "target": "op_ossm", "badge": 1 },
        { "text": "3. Subscribe the MCP Gateway operator via OLM, with an AllNamespaces OperatorGroup", "mode": "lightup", "target": "op_mcpgw", "badge": 2 },
        { "text": "4. The three CRDs land: MCPGatewayExtension, MCPServerRegistration, MCPVirtualServer", "mode": "lightup", "target": "n_crds", "badge": 3 },
        { "text": "5. Controller pod runs - and there is still no broker pod. That is correct", "mode": "lightup", "target": "n_ctrl", "badge": 4 },
        { "text": "6. Phase 2 begins - Gateway setup", "mode": "arrow", "from": "c1_prereq", "to": "c2_gateway", "color": "#f0883e", "num": 6, "glow": "c2_gateway" },
        { "text": "7. Create the Gateway in the mcp-gateway namespace", "mode": "lightup", "target": "n_gw", "badge": 7 },
        { "text": "8. Add the public mcp listener on port 8080, on a DNS-resolvable host", "mode": "lightup", "target": "n_lis_mcp", "badge": 8 },
        { "text": "9. Add the internal mcps listener (*.mcp.local) on the SAME port 8080", "mode": "lightup", "target": "n_lis_mcps", "badge": 9 },
        { "text": "10. Create the OpenShift Route - it terminates TLS in front of the Gateway", "mode": "lightup", "target": "n_route", "badge": 10 },
        { "text": "11. Phase 3 begins - the MCP Gateway Extension", "mode": "arrow", "from": "c2_gateway", "to": "c3_ext", "color": "#3fb950", "num": 11, "glow": "c3_ext" },
        { "text": "12. Create the MCPGatewayExtension with sectionName: mcp", "mode": "lightup", "target": "n_ext", "badge": 12 },
        { "text": "13. Create the ReferenceGrant in the GATEWAY's namespace, not the extension's", "mode": "lightup", "target": "n_refgrant", "badge": 13 },
        { "text": "14. The controller finally creates the broker-router pod - one container, ports 8080 + 50051", "mode": "lightup", "target": "n_brpod", "badge": 14 },
        { "text": "15. An EnvoyFilter registers the router as ext_proc on the Gateway", "mode": "lightup", "target": "n_envoyf", "badge": 15 },
        { "text": "16. Phase 4 begins - register the MCP servers", "mode": "arrow", "from": "c3_ext", "to": "c4_servers", "color": "#d2a8ff", "num": 16, "glow": "c4_servers" },
        { "text": "17. Deploy test-server1 in mcp-test and give it the test1_ prefix", "mode": "lightup", "target": "n_srv1", "badge": 17 },
        { "text": "18. Deploy risk-server with the risk_ prefix - HTTPRoutes carry parentRefs.namespace: mcp-gateway", "mode": "lightup", "target": "n_srv2", "badge": 18 },
        { "text": "19. Register the off-cluster server behind an in-cluster TLS-origination proxy", "mode": "lightup", "target": "n_srvext", "badge": 19 },
        { "text": "20. Create one MCPServerRegistration per server - they report READY: False at first", "mode": "lightup", "target": "n_reg", "badge": 20 },
        { "text": "21. The controller writes the mcp-gateway-config Secret - now restart the broker to load it", "mode": "arrow", "from": "n_reg", "to": "n_config", "color": "#d2a8ff", "num": 21, "glow": "c_runtime" },
        { "text": "22. Phase 5 begins - verification", "mode": "arrow", "from": "c4_servers", "to": "c5_verify", "color": "#8b949e", "num": 22, "glow": "c5_verify" },
        { "text": "23. initialize returns an mcp-session-id - send it on every later request", "mode": "lightup", "target": "n_init", "badge": 23 },
        { "text": "24. tools/list returns one aggregated, prefixed list from all three servers", "mode": "lightup", "target": "n_list", "badge": 24 },
        { "text": "25. tools/call test1_greet comes back as SSE - the JSON is in the data: field", "mode": "lightup", "target": "n_call", "badge": 25 },
        { "text": "26. ./scripts/verify.sh runs the whole sequence end to end", "mode": "lightup", "target": "n_verify", "badge": 26 },
        { "text": "27. Phase 6 begins - Red Hat build of Keycloak (optional from here on)", "mode": "arrow", "from": "c5_verify", "to": "c6_rhbk", "color": "#db61a2", "num": 27, "glow": "c6_rhbk" },
        { "text": "28. Deploy RHBK and import the mcp realm (the guide ships its own Route)", "mode": "lightup", "target": "n_rhbk", "badge": 28 },
        { "text": "29. One resource-server client per MCP server, clientId = <namespace>/<registration>", "mode": "lightup", "target": "n_clients", "badge": 29 },
        { "text": "30. One client role per tool, named tool:<name> WITHOUT the registration prefix", "mode": "lightup", "target": "n_roles", "badge": 30 },
        { "text": "31. Phase 7 begins - authentication", "mode": "arrow", "from": "c6_rhbk", "to": "c7_auth", "color": "#ffa657", "num": 31, "glow": "c7_auth" },
        { "text": "32. Configure OAuth through the Extension's oauthProtectedResource, never with oc set env", "mode": "lightup", "target": "n_oauthpr", "badge": 32 },
        { "text": "33. Create the Kuadrant CR - it deploys Authorino and the WASM filter", "mode": "lightup", "target": "n_kuadrant", "badge": 33 },
        { "text": "34. Apply mcp-auth-policy - JWT validation on the public mcp listener", "mode": "lightup", "target": "n_authpol", "badge": 34 },
        { "text": "35. Phase 8 begins - authorization", "mode": "arrow", "from": "c7_auth", "to": "c8_authz", "color": "#39c5cf", "num": 35, "glow": "c8_authz" },
        { "text": "36. Apply mcp-authz-policy on the internal mcps listener - keep BOTH policies", "mode": "lightup", "target": "n_authzpol", "badge": 36 },
        { "text": "37. The router-set x-mcp-toolname / servername / method headers are what it matches on", "mode": "lightup", "target": "n_hdr", "badge": 37 },
        { "text": "38. CEL checks tool:<name> against the resource_access roles for that server", "mode": "lightup", "target": "n_claim", "badge": 38 },
        { "text": "39. Phase 9 begins - virtual MCP servers", "mode": "arrow", "from": "c8_authz", "to": "c9_virtual", "color": "#79c0ff", "num": 39, "glow": "c9_virtual" },
        { "text": "40. Create the MCPVirtualServer resources in mcp-system", "mode": "lightup", "target": "n_vs", "badge": 40 },
        { "text": "41. Merge their config into the broker Secret, then restart the broker", "mode": "lightup", "target": "n_merge", "badge": 41 },
        { "text": "42. Clients opt in per request with X-Mcp-Virtualserver: namespace/name", "mode": "lightup", "target": "n_vshdr", "badge": 42 },
        { "text": "43. Install complete - one endpoint, one authorized tool set, many MCP servers", "mode": "arrow", "from": "c9_virtual", "to": "agent", "color": "#3fb950", "num": 43 }
      ]
    },
    "broker": {
      "label": "Gotcha: The Missing Broker Pod",
      "steps": [
        { "text": "1. Phase 1 finishes cleanly - operator installed, CSV Succeeded", "mode": "arrow", "from": "admin", "to": "c1_prereq", "color": "#58a6ff", "num": 1, "glow": "c1_prereq" },
        { "text": "2. The controller pod is running in mcp-gateway", "mode": "lightup", "target": "n_ctrl", "badge": 1 },
        { "text": "3. You go looking for a broker pod. oc get pods shows only the controller", "mode": "lightup", "target": "n_brpod", "badge": "✗", "errColor": "#f85149" },
        { "text": "4. Nothing is broken. The broker is layer 2 and does not exist yet", "mode": "arrow", "from": "n_brpod", "to": "admin", "color": "#f85149", "num": 4 },
        { "text": "5. The broker is created by the controller, on demand, from an extension", "mode": "arrow", "from": "admin", "to": "n_ext", "color": "#3fb950", "num": 5, "glow": "c3_ext" },
        { "text": "6. Create the MCPGatewayExtension (Phase 3) and wait for Ready", "mode": "lightup", "target": "n_ext", "badge": 6 },
        { "text": "7. Now the broker-router pod appears - in the EXTENSION's namespace", "mode": "lightup", "target": "n_brpod", "badge": 7 },
        { "text": "8. Port 50051 of that container is the router (Envoy ext_proc, gRPC)", "mode": "lightup", "target": "n_router", "badge": 8 },
        { "text": "9. Port 8080 of the SAME container is the broker. One pod, two ports - not two deployments", "mode": "lightup", "target": "n_broker", "badge": 9 },
        { "text": "10. So one rollout restart restarts both, and a crash takes out both at once", "mode": "arrow", "from": "n_brpod", "to": "n_envoyf", "color": "#3fb950", "num": 10 }
      ]
    },
    "ports": {
      "label": "Gotcha: Both Listeners, One Port",
      "steps": [
        { "text": "1. An agent sends tools/call test1_greet to the public mcp listener on port 8080", "mode": "arrow", "from": "agent", "to": "n_lis_mcp", "color": "#f0883e", "num": 1, "glow": "c2_gateway" },
        { "text": "2. The public listener is the only DNS-resolvable one: mcp.<cluster-domain>", "mode": "lightup", "target": "n_lis_mcp", "badge": 1 },
        { "text": "3. ext_proc hands the request to the router before Envoy routes it", "mode": "arrow", "from": "n_lis_mcp", "to": "n_router", "color": "#3fb950", "num": 3, "glow": "c_runtime" },
        { "text": "4. The router rewrites :authority to server1.mcp.local to pick the backend", "mode": "lightup", "target": "n_router", "badge": 4 },
        { "text": "5. That host only exists on the internal mcps listener - which is on the same port 8080", "mode": "lightup", "target": "n_lis_mcps", "badge": 5 },
        { "text": "6. HTTP listeners sharing a port share ONE Envoy route table, so the rewrite resolves", "mode": "arrow", "from": "n_router", "to": "n_srv1", "color": "#3fb950", "num": 6, "glow": "c4_servers" },
        { "text": "7. Put mcps on a different port (8081) and it gets its own route table", "mode": "lightup", "target": "n_lis_mcps", "badge": "✗", "errColor": "#f85149" },
        { "text": "8. The rewritten :authority then matches no route - every tools/call fails (OSDOCS-24039)", "mode": "arrow", "from": "n_router", "to": "n_srv1", "color": "#f85149", "num": 8 },
        { "text": "9. Same trap with HTTPS: each TLS filter chain has its own route table, so use ONE wildcard listener", "mode": "lightup", "target": "n_route", "badge": "i" }
      ]
    },
    "authz": {
      "label": "Why Tool Authorization Needs Two Policies",
      "steps": [
        { "text": "1. An agent calls tools/call test1_greet with a bearer token from RHBK", "mode": "arrow", "from": "agent", "to": "n_lis_mcp", "color": "#ffa657", "num": 1, "glow": "c7_auth" },
        { "text": "2. mcp-auth-policy validates the JWT on the public mcp listener - and only that", "mode": "lightup", "target": "n_authpol", "badge": 1 },
        { "text": "3. ext_proc is INSERT_FIRST, so the router parses the JSON-RPC body before any policy runs", "mode": "lightup", "target": "n_router", "badge": 2 },
        { "text": "4. The router sets x-mcp-toolname, x-mcp-servername and x-mcp-method - a client never can", "mode": "lightup", "target": "n_hdr", "badge": 3 },
        { "text": "5. :authority is rewritten, so the request now arrives on the internal mcps listener", "mode": "arrow", "from": "n_router", "to": "n_lis_mcps", "color": "#39c5cf", "num": 5, "glow": "c8_authz" },
        { "text": "6. mcp-authz-policy evaluates there, where the tool headers exist to match against", "mode": "lightup", "target": "n_authzpol", "badge": 6 },
        { "text": "7. CEL prepends tool: to the tool name and looks it up in resource_access[<server>].roles", "mode": "lightup", "target": "n_claim", "badge": 7 },
        { "text": "8. The mcp user has every tool: allowed, Envoy forwards with the prefix stripped", "mode": "arrow", "from": "n_authzpol", "to": "n_srv1", "color": "#3fb950", "num": 8 },
        { "text": "9. The restricted user only holds tool:greet, so risk_calculate_dti comes back 403", "mode": "lightup", "target": "n_claim", "badge": "✗", "errColor": "#f85149" },
        { "text": "10. The when guard on x-mcp-method == tools/call is what keeps session setup from being denied", "mode": "lightup", "target": "n_hdr", "badge": "i" },
        { "text": "11. Both policies must coexist - deleting the Phase 7 one breaks JWT validation entirely", "mode": "lightup", "target": "n_authpol", "badge": "i" }
      ]
    },
    "virtual": {
      "label": "Virtual Servers & Progressive Discovery",
      "steps": [
        { "text": "1. An agent connects and asks for tools/list through the public endpoint", "mode": "arrow", "from": "agent", "to": "n_broker", "color": "#79c0ff", "num": 1, "glow": "c_runtime" },
        { "text": "2. The broker aggregates every registered server's tools into one prefixed list", "mode": "lightup", "target": "n_broker", "badge": 1 },
        { "text": "3. Federate enough servers and that list becomes the problem - context bloat, worse tool picks", "mode": "lightup", "target": "n_list", "badge": "i" },
        { "text": "4. Operators pre-curate a scope instead: an MCPVirtualServer in mcp-system", "mode": "arrow", "from": "admin", "to": "n_vs", "color": "#79c0ff", "num": 4, "glow": "c9_virtual" },
        { "text": "5. risk-analysis and basic-tools each select a subset, or whole categories", "mode": "lightup", "target": "n_vs", "badge": 5 },
        { "text": "6. Merge the virtual server config into the broker's Secret - this step is easy to miss", "mode": "lightup", "target": "n_merge", "badge": 6 },
        { "text": "7. Skip the merge and every request with the header fails, though the CRs look healthy", "mode": "lightup", "target": "n_merge", "badge": "✗", "errColor": "#f85149" },
        { "text": "8. Restart the broker so it reads the merged config at startup", "mode": "arrow", "from": "n_merge", "to": "n_config", "color": "#79c0ff", "num": 8 },
        { "text": "9. The agent now opts in per request with X-Mcp-Virtualserver: mcp-system/risk-analysis", "mode": "lightup", "target": "n_vshdr", "badge": 9 },
        { "text": "10. tools/list returns only that scope - omit the header and you get everything again", "mode": "arrow", "from": "n_vshdr", "to": "agent", "color": "#3fb950", "num": 10 },
        { "text": "11. Authorization still applies on top: a virtual server narrows the offer, it never grants access", "mode": "lightup", "target": "n_authzpol", "badge": "i" }
      ]
    }
  },
  "flowOrder": ["full", "broker", "ports", "authz", "virtual"],
  "defaultFlow": "full",
  "legend": [
    { "color": "#58a6ff", "label": "Phase 1 · Operators" },
    { "color": "#f0883e", "label": "Phase 2 · Gateway" },
    { "color": "#3fb950", "label": "Phase 3 · Extension" },
    { "color": "#d2a8ff", "label": "Phase 4 · MCP Servers" },
    { "color": "#8b949e", "label": "Phase 5 · Verification" },
    { "color": "#db61a2", "label": "Phase 6 · Keycloak" },
    { "color": "#ffa657", "label": "Phase 7 · Authentication" },
    { "color": "#39c5cf", "label": "Phase 8 · Authorization" },
    { "color": "#79c0ff", "label": "Phase 9 · Virtual Servers" },
    { "color": "#f85149", "label": "Known failure / gotcha" }
  ]
};

await viz.load(diagram);

const cvs = el('fs-canvas');
cvs.addEventListener('mousemove', e => {
  const rect = cvs.getBoundingClientRect();
  const eng = viz._engine;
  const mx = (e.clientX - rect.left - eng._ox) / eng._sc;
  const my = (e.clientY - rect.top - eng._oy) / eng._sc;
  let hit = false;
  for (const [k, n] of Object.entries(eng.state.nodes)) {
    if (n.type === 'boundary' || n.type === 'container') continue;
    if (eng.state.tooltips[k] && mx >= n.x && mx <= n.x + n.w && my >= n.y && my <= n.y + n.h) {
      hit = true;
      break;
    }
  }
  cvs.style.cursor = hit ? 'pointer' : 'default';
});

viz.state.loopMode = true;
viz.play();
</script>
