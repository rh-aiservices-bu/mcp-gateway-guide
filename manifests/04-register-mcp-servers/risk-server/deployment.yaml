apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-risk-server
  namespace: mcp-test
  labels:
    app: mcp-risk-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-risk-server
  template:
    metadata:
      labels:
        app: mcp-risk-server
    spec:
      containers:
        - name: mcp-risk-server
          image: quay.io/rh-ai-quickstart/mortgage-ai-api:latest
          command: ["python", "-m", "src.mcp_server"]
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
