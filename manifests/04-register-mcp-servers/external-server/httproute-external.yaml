# From the Gateway's point of view the external server is an ordinary
# in-cluster backend: the proxy Service. The *.mcp.local hostname matches the
# Gateway's "mcps" listener, exactly like the local servers.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: external-server-route
  namespace: mcp-test
  labels:
    mcp-server: "true"
spec:
  parentRefs:
    - name: mcp-gateway
      namespace: mcp-gateway
  hostnames:
    - "external-server.mcp.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: external-mcp-proxy
          port: 8080
