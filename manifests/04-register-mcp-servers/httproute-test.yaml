apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: test-server1-route
  namespace: mcp-test
  labels:
    mcp-server: "true"
spec:
  parentRefs:
    - name: mcp-gateway
      namespace: mcp-gateway
  hostnames:
    - "test-server1.mcp.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: test-server1
          port: 8080
